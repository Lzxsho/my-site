<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>朔的小窝 · Shuoscape</title>
  <defs>
    <!-- 粉 → 紫 → 蓝，和 css/base.css 里的品牌变量同一套色 -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb0d8"/>
      <stop offset="0.52" stop-color="#c3a4ff"/>
      <stop offset="1" stop-color="#9fd4ff"/>
    </linearGradient>
  </defs>

  <!-- 外圈：底色 + 渐变描边 -->
  <circle cx="32" cy="32" r="30" fill="url(#g)"/>
  <circle cx="32" cy="32" r="26" fill="#fdf8fe" opacity="0.92"/>

  <!-- 中间一个「朔」字 -->
  <text x="32" y="32"
        font-family="'PingFang SC','Microsoft YaHei','Songti SC',serif"
        font-size="30" font-weight="700"
        text-anchor="middle" dominant-baseline="central"
        fill="url(#g)">朔</text>

  <!-- 右下角一颗小星，跟站里的「发光」意象对上 -->
  <path d="M49 15 l1.9 4.6 4.6 1.9 -4.6 1.9 -1.9 4.6 -1.9-4.6 -4.6-1.9 4.6-1.9z" fill="#ffb0d8"/>
</svg>
